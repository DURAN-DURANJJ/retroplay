
<!DOCTYPE html>
<html lang="es">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darkwatch | RetroPlay</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #100d1c;

      font-family: Arial, sans-serif;
    }
    header, main {
      max-width: 1000px;
      margin: 0 auto 24px;

    h1 { color: #c49aff; }
    .screen {
      width: 100%;
      height: 70vh;

 <iframe

<body>
  <header>

  <main>
